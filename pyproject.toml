[project]
name = "terraform-registry-stub"
version = "0.1.0"
description = "A CLI tool to cache and serve Terraform provider registry responses"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "David Alexander", email = "opensource@thelonelyghost.com" }
]
keywords = ["terraform", "registry", "provider", "cache", "mirror"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Build Tools",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "httpx>=0.24",
    "fastapi>=0.100",
    "uvicorn[standard]>=0.23",
    "rich>=13.0",
    "semantic-version>=2.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-asyncio>=0.21",
    "ruff>=0.1",
]

[project.scripts]
terraform-registry-stub = "terraform_registry_stub.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/terraform_registry_stub"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--cov=terraform_registry_stub",
    "--cov-report=term-missing",
    "--cov-report=html",
]
# Filter false positive warnings from pytest-asyncio's interaction with stdlib/third-party code.
# These warnings occur when pytest-asyncio's automatic mock patching creates AsyncMock objects
# that are then introspected by Python's stdlib (yaml, argparse, ast, abc) and third-party
# libraries (FastAPI) during test execution. The coroutines are never meant to be awaited as
# they're just artifacts of the mocking mechanism inspecting our test doubles.
filterwarnings = [
    "ignore:coroutine '.*AsyncMockMixin._execute_mock_call' was never awaited:RuntimeWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "S",   # flake8-bandit (security)
    "RET", # flake8-return
    "SIM", # flake8-simplify
]
ignore = [
    "E501",    # line too long, handled by ruff format
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**/*.py" = [
    "S101",    # Allow assert in tests
    "SIM117",  # Combine multiple nested `with` blocks
    "S104",    # Allow `0.0.0.0` binding in automated tests
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
